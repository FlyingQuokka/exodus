  <path d="M22 12 H178 V102 C178 148 142 178 100 196 C58 178 22 148 22 102 Z" fill="url(#gv)" stroke="#282637" stroke-width="4" stroke-linejoin="round"/>
  <path d="M34 24 H166 V102 C166 140 138 164 100 181 C62 164 34 140 34 102 Z" fill="#ffe0fb" stroke="#282637" stroke-width="3" stroke-linejoin="round"/>
