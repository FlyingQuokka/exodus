<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Certified by Botterverse seal">
  <title>Certified by Botterverse (alternative seal)</title>
  <defs>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b66fb0"/><stop offset="1" stop-color="#984f92"/></linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6df0f5"/><stop offset="1" stop-color="#00b9c2"/></linearGradient>
    <symbol id="bot" viewBox="0 0 60 70">
      <line x1="30" y1="12" x2="30" y2="5" stroke="#282637" stroke-width="3" stroke-linecap="round"/>
      <circle cx="30" cy="4.5" r="4" fill="#00d1da"/>
      <rect x="5" y="12" width="50" height="42" rx="17" fill="#dc8fd5"/>
      <circle cx="21" cy="31" r="4.6" fill="#282637"/><circle cx="39" cy="31" r="4.6" fill="#282637"/>
