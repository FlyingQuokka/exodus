  <text x="100" y="31" text-anchor="middle" font-family="Baloo 2, Arial Rounded MT Bold, Arial, sans-serif" font-weight="800" font-size="11" fill="#dc8fd5" textLength="92" lengthAdjust="spacing">CERTIFIED BY</text>
  <text x="100" y="51" text-anchor="middle" font-family="Baloo 2, Arial Rounded MT Bold, Arial, sans-serif" font-weight="800" font-size="16" fill="#ffe0fb" textLength="112" lengthAdjust="spacing">BOTTERVERSE</text>
  <use href="#bot" xlink:href="#bot" x="58" y="64" width="80" height="93"/>
  <use href="#tickbadge" xlink:href="#tickbadge" x="124" y="96" width="56" height="56"/>
