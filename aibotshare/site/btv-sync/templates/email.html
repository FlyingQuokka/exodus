<!DOCTYPE html>
<html lang="en-GB" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="x-apple-disable-message-reformatting">
<title>{{crm.business_name}}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style type="text/css">
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0; mso-table-rspace: 0; }
  img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; background-color: #f8f7ff; }
  /* Defaults for the email body that FluentCRM inserts */
  .bv-body { font-family: 'Nunito Sans', 'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif; font-size: 17px; line-height: 1.6; color: #2b1a2a; }
  .bv-body h1 { font-family: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif; font-size: 28px; line-height: 1.25; color: #391d37; margin: 0 0 16px; font-weight: 700; }
  .bv-body h2 { font-family: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif; font-size: 21px; line-height: 1.3; color: #391d37; margin: 28px 0 8px; font-weight: 700; }
  .bv-body h3 { font-family: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif; font-size: 18px; line-height: 1.3; color: #391d37; margin: 22px 0 6px; font-weight: 700; }
  .bv-body p { margin: 0 0 16px; }
  .bv-body a { color: #8a3f84; text-decoration: underline; }
  .bv-body ol, .bv-body ul { margin: 0 0 16px; padding-left: 26px; }
  .bv-body li { margin: 0 0 8px; padding-left: 4px; }
  .bv-body blockquote { margin: 0 0 18px; padding: 14px 18px; background-color: #f3eefb; border-left: 4px solid #dc8fd5; color: #2b1a2a; }
  .bv-body blockquote p:last-child { margin-bottom: 0; }
  .bv-body hr { border: 0; border-top: 1px solid #e6dff2; margin: 24px 0; }
  .bv-body img { max-width: 100%; height: auto; }
  @media only screen and (max-width: 620px) {
    .bv-wrap { width: 100% !important; }
    .bv-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .bv-body { font-size: 16px !important; }
    .bv-body h1 { font-size: 25px !important; }
    .bv-logo { width: 170px !important; height: auto !important; }
  }
  @media (prefers-color-scheme: dark) {
    body, .bv-page { background-color: #1a0f1b !important; }
    .bv-card { background-color: #2a1a2b !important; }
    .bv-logostrip { background-color: #ffffff !important; }
    .bv-body, .bv-body p, .bv-body li, .bv-body blockquote { color: #f1e8f0 !important; }
    .bv-body h1, .bv-body h2, .bv-body h3 { color: #ffffff !important; }
    .bv-body a { color: #efb4ea !important; }
    .bv-body blockquote { background-color: #3a2439 !important; border-left-color: #dc8fd5 !important; }
    .bv-body hr { border-top-color: #4a3349 !important; }
    .bv-foot, .bv-foot a { color: #cdbfcc !important; }
  }
  [data-ogsc] .bv-body, [data-ogsc] .bv-body p, [data-ogsc] .bv-body li { color: #f1e8f0 !important; }
  [data-ogsc] .bv-body a { color: #efb4ea !important; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f8f7ff;">
<table role="presentation" class="bv-page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8f7ff;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="bv-wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">
        <tr>
          <td class="bv-card" bgcolor="#ffffff" style="background-color:#ffffff;border-radius:16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <!-- Logo strip: stays white in dark mode so the logo stays readable -->
              <tr>
                <td class="bv-logostrip bv-pad" align="center" bgcolor="#ffffff" style="background-color:#ffffff;padding:28px 32px 20px;border-radius:16px 16px 0 0;">
                  <a href="https://{{domain}}/" target="_blank" style="text-decoration:none;"><img class="bv-logo" src="https://{{domain}}/wp-content/uploads/btv-email-logo.png" width="200" alt="Botterverse" style="display:block;width:200px;max-width:100%;height:auto;margin:0 auto;border:0;"></a>
                </td>
              </tr>
              <!-- Email body from FluentCRM -->
              <tr>
                <td class="bv-pad" style="padding:8px 40px 32px;">
                  <div class="bv-body" style="font-family:'Nunito Sans','Trebuchet MS','Segoe UI',Verdana,Arial,sans-serif;font-size:17px;line-height:1.6;color:#2b1a2a;">
{{crm.email_body}}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td class="bv-foot bv-pad" align="center" style="padding:24px 32px 8px;font-family:'Nunito Sans','Trebuchet MS','Segoe UI',Verdana,Arial,sans-serif;font-size:13px;line-height:1.6;color:#5d4a5c;">
            <p style="margin:0 0 10px;">Botterverse does not promise or guarantee any income.</p>
            <p style="margin:0 0 10px;"><a href="##crm.manage_subscription_url##" style="color:#5d4a5c;text-decoration:underline;">Manage your preferences</a> &nbsp;|&nbsp; <a href="##crm.unsubscribe_url##" style="color:#5d4a5c;text-decoration:underline;">Unsubscribe</a></p>
            <p style="margin:0;">{{crm.business_name}}<br>{{crm.business_address}}</p>
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
