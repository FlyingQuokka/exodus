<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Certified by Botterverse seal">
  <title>Certified by Botterverse (small seal for 64 pixels and under)</title>
  <defs>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b66fb0"/><stop offset="1" stop-color="#984f92"/></linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6df0f5"/><stop offset="1" stop-color="#00b9c2"/></linearGradient>
    <symbol id="bot" viewBox="0 0 60 70">
      <line x1="30" y1="12" x2="30" y2="5" stroke="#282637" stroke-width="3" stroke-linecap="round"/>
      <circle cx="30" cy="4.5" r="4" fill="#00d1da"/>
      <rect x="5" y="12" width="50" height="42" rx="17" fill="#dc8fd5"/>
      <circle cx="21" cy="31" r="4.6" fill="#282637"/><circle cx="39" cy="31" r="4.6" fill="#282637"/>
      <path d="M22 41 Q30 47 38 41" stroke="#282637" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="14" y="54" width="10" height="12" rx="5" fill="#984f92"/><rect x="36" y="54" width="10" height="12" rx="5" fill="#984f92"/>
    </symbol>
    <symbol id="tickbadge" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21" fill="url(#gc)" stroke="#282637" stroke-width="3.5"/>
      <path d="M13 25 L21 33 L36 15" fill="none" stroke="#282637" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 25 L21 33 L36 15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    </symbol>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#fff" stroke="#282637" stroke-width="8"/><circle cx="100" cy="100" r="78" fill="#ffe0fb" stroke="#984f92" stroke-width="5"/><use href="#bot" xlink:href="#bot" x="52" y="36" width="90" height="105"/><use href="#tickbadge" xlink:href="#tickbadge" x="108" y="92" width="84" height="84"/>
</svg>
