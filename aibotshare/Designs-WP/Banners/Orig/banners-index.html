<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Botterverse banners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap">
<style>
body { margin:0; background:#f1f1f8; color:#282637; font-family:'Nunito Sans',system-ui,sans-serif; padding:32px 16px; }
h1 { font-family:'Baloo 2',system-ui,sans-serif; margin:0 0 6px; }
.lead { margin:0 0 28px; color:#4f4d5f; }
.grid { display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start; }
figure { margin:0; }
figcaption { font-weight:700; margin-bottom:8px; }
.box { overflow:hidden; border-radius:4px; box-shadow:0 4px 16px rgba(40,38,55,.15); }
.box iframe { border:0; display:block; transform-origin:0 0; }
</style></head><body>
<h1>Botterverse affiliate banners</h1>
<p class="lead">Eight banners scaled to fit. The PNG files are in the png folder.</p>
<div class="grid" id="grid"></div>
<script>
var list=[["728x90",728,90,1],["300x250",300,250,1],["160x600",160,600,.7],["970x250",970,250,.7],["320x50",320,50,1],["1200x628",1200,628,.4],["1080x1080",1080,1080,.35],["1080x1920",1080,1920,.25]];
var g=document.getElementById('grid');
list.forEach(function(b){
  var f=document.createElement('figure');
  f.innerHTML='<figcaption>'+b[0]+'</figcaption><div class="box" style="width:'+b[1]*b[3]+'px;height:'+b[2]*b[3]+'px"><iframe src="banner-'+b[0]+'.html" title="Banner '+b[0]+'" width="'+b[1]+'" height="'+b[2]+'" scrolling="no" style="transform:scale('+b[3]+')"></iframe></div>';
  g.appendChild(f);
});
</script></body></html>
